<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb-workout-tracker — integration</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  #report { position: fixed; inset: 0; z-index: 9999; overflow: auto; padding: 1.2rem;
            background: #12141a; color: #e6e8ee; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  #report li { list-style: none; border-bottom: 1px solid #23262f; padding: .3rem 0; }
  .pass::before { content: "PASS  "; color: #7ee2a0; }
  .fail::before { content: "FAIL  "; color: #ff6b6b; }
  pre.err { color: #ffb4b4; margin: .3rem 0 .4rem 3.5rem; white-space: pre-wrap; }
  #summary { padding: .7rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-weight: 700; }
  .ok { background: #16351f; color: #7ee2a0; } .bad { background: #3a1a1e; color: #ff9d9d; }
</style>
</head>
<body>
<div id="report"><div id="summary">Running…</div><ul id="rows"></ul></div>

<script>
// Cache-busting the entry module's own import() call isn't enough: app.js's
// internal `import './store.js'` resolves independently to the plain,
// unbusted absolute URL, which can itself be stale in this environment even
// with the HTTP cache, Cache Storage and any service worker all ruled out —
// some deeper engine-level code cache, keyed by exact URL. An import map
// rewrites every local module's resolved (absolute) URL to a uniquely
// query-stringed one in a single place, so the whole dependency graph gets a
// consistently fresh cache key regardless of how many levels deep it's
// imported from. This has to be a classic (non-module) script, and it has to
// run before any module script in the document — an import map added after
// module resolution has started throws.
(function () {
  const bust = Date.now();
  const files = ['app.js', 'github.js', 'merge.js', 'model.js', 'programme.js', 'schema.js', 'store.js', 'sync.js'];
  const imports = {};
  for (const f of files) {
    const abs = new URL(`../js/${f}`, location.href).href;
    imports[abs] = `${abs}?t=${bust}`;
  }
  const s = document.createElement('script');
  s.type = 'importmap';
  s.textContent = JSON.stringify({ imports });
  document.currentScript.after(s);
})();
</script>
<script type="module">
/**
 * End-to-end test of the real UI against a fake GitHub API. The headless
 * suite in run.html covers the rules; this covers the wiring between them
 * and the DOM — sign-in gate, gist creation, logging a session, the save
 * flow, and the offline queue.
 *
 * The page loads index.html's own markup rather than duplicating it, so this
 * test cannot silently drift from the real document.
 */

// A service worker registered by an earlier index.html load persists for
// this origin independently of any tab (unlike localStorage) and, scoped to
// "/", also controls this page. Unregistering it here isn't reliable on its
// own: browsers throttle how often they re-check a registered worker's
// script for changes (well over a minute, sometimes 24h), so a fresh
// register() call — which bindChrome() makes on every boot() — can win the
// race and keep an old worker (and whatever it has cached) in control
// regardless. The one fully reliable fix is to stop this run from
// registering a worker at all.
for (const reg of await navigator.serviceWorker.getRegistrations()) await reg.unregister();
for (const key of await caches.keys()) await caches.delete(key);
navigator.serviceWorker.register = () => Promise.reject(new Error('service worker disabled for this test run'));

const results = [];
const check = (name, fn) => { try { fn(); results.push({ name, passed: true }); }
                              catch (e) { results.push({ name, passed: false, error: e.message }); } };

function assert(cond, msg) { if (!cond) throw new Error(msg); }
function assertEq(a, b, msg) {
  if (a !== b) throw new Error(`${msg}\n    expected: ${JSON.stringify(b)}\n    actual:   ${JSON.stringify(a)}`);
}

const waitFor = async (fn, label, timeout = 4000) => {
  const start = Date.now();
  for (;;) {
    try { const v = fn(); if (v) return v; } catch {}
    if (Date.now() - start > timeout) throw new Error(`timed out waiting for: ${label}`);
    await new Promise((r) => setTimeout(r, 40));
  }
};

// --- fake GitHub API ---------------------------------------------------------

const DATA_FILE_NAME = 'kb-workout-tracker-data.json';
const FAKE_TOKEN = 'fake-pat-token';
const github = { gists: new Map(), nextId: 1, rev: 0 };

function jsonResponse(body, status = 200, headers = {}) {
  return new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json', ...headers } });
}

function bumpRevision(gist) {
  gist.updated_at = new Date().toISOString();
  gist.history.unshift({ version: `sha-${++github.rev}`, committed_at: gist.updated_at });
}

const realFetch = window.fetch.bind(window);

window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url;
  if (!/api\.github\.com/.test(url)) return realFetch(input, init);
  if (window.__forceOffline) throw new TypeError('Failed to fetch');

  const u = new URL(url);
  const method = (init.method || 'GET').toUpperCase();
  const auth = (init.headers || {}).Authorization || '';
  const token = auth.replace(/^Bearer\s+/, '');

  if (u.pathname === '/user') {
    if (token !== FAKE_TOKEN) return jsonResponse({ message: 'Bad credentials' }, 401);
    return jsonResponse({ login: 'nrharrap' }, 200, { 'x-oauth-scopes': 'gist' });
  }

  if (token !== FAKE_TOKEN) return jsonResponse({ message: 'Bad credentials' }, 401);

  if (u.pathname === '/gists' && method === 'GET') {
    return jsonResponse([...github.gists.values()].map((g) => ({ id: g.id, created_at: g.created_at, files: g.files })));
  }

  if (u.pathname === '/gists' && method === 'POST') {
    const body = JSON.parse(init.body);
    const id = `gist-${github.nextId++}`;
    const gist = { id, created_at: new Date().toISOString(), files: {}, history: [] };
    for (const [name, f] of Object.entries(body.files)) gist.files[name] = { content: f.content, truncated: false };
    bumpRevision(gist);
    github.gists.set(id, gist);
    return jsonResponse({ id });
  }

  const single = u.pathname.match(/^\/gists\/([^/]+)$/);
  if (single && method === 'GET') {
    const g = github.gists.get(single[1]);
    return g ? jsonResponse(g) : jsonResponse({ message: 'Not Found' }, 404);
  }
  if (single && method === 'PATCH') {
    const g = github.gists.get(single[1]);
    if (!g) return jsonResponse({ message: 'Not Found' }, 404);
    const body = JSON.parse(init.body);
    Object.assign(g.files, body.files);
    bumpRevision(g);
    return jsonResponse(g);
  }

  return jsonResponse({ message: `unhandled ${method} ${u.pathname}` }, 500);
};

// --- load the real markup, then the real app --------------------------------
//
// Signing in is now just filling in a token and submitting a form — no
// popup, no redirect, nothing this harness needs to fake beyond the GitHub
// API itself above. That's the whole point of the switch away from Google
// OAuth: this integration test got *simpler* along with the real UX.

localStorage.clear();

const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
const report = document.getElementById('report');
document.body.innerHTML = doc.body.innerHTML;
document.body.appendChild(report);
// The inline module tag from index.html isn't executed by innerHTML; import
// it. Plain specifier — the import map above (loaded before this script)
// transparently rewrites this and every module it imports to a fresh URL.
await import('../js/app.js');

// --- the run ----------------------------------------------------------------

try {
  // T1 — first open, no prior sign-in.
  check('T1 — first open shows the sign-in gate', () => {
    assert(!document.getElementById('view-signin').hidden, 'sign-in view should be visible');
    assert(document.getElementById('tabbar').hidden, 'tabs hidden until signed in');
    assertEq(github.gists.size, 0, 'nothing touched on GitHub before sign-in');
  });

  // T2 — paste a token and connect; the gist is created.
  document.getElementById('signin-token-input').value = FAKE_TOKEN;
  document.getElementById('btn-connect').click();
  await waitFor(() => document.getElementById('view-signin').hidden, 'signed in');

  check('T2 — connecting a valid token creates the gist and loads the app', () => {
    assertEq(github.gists.size, 1, 'exactly one gist created');
    assertEq(Object.keys([...github.gists.values()][0].files)[0], DATA_FILE_NAME, 'file name');
    assert(!document.getElementById('tabbar').hidden, 'tabs now available');
    assertEq(JSON.parse(localStorage.getItem('kbwt.authToken')), FAKE_TOKEN, 'the token is persisted for next open');
  });

  // Start a cycle.
  const startBtn = await waitFor(() => document.querySelector('[data-act="start-cycle"]'), 'start-cycle button');
  startBtn.click();
  await waitFor(() => document.querySelector('[data-act="save-workout"]'), 'session view');

  check('a new cycle opens on week 1, Day A', () => {
    const heading = document.querySelector('#view-today h2').textContent;
    assert(heading.startsWith('Day A'), `expected Day A, got "${heading}"`);
    assert(/Week 1 of 13/.test(document.querySelector('#view-today .muted').textContent), 'week 1');
  });

  check('T12 — the first target on screen is verbatim from the source document', () => {
    const target = document.querySelector('.ex-target').textContent.trim();
    assertEq(target, '4x12 @ 16kg', 'KB Swing, Block 1');
  });

  check('reps pre-fill with the programme\'s target rep count', () => {
    const first = document.querySelector('input[data-id="kb-swing-2h"][data-field="reps"][data-i="0"]');
    assertEq(first.value, '12', 'Block 1 KB Swing is 4x12, so set 1 reps should default to 12');
  });

  check('bodyweight exercises (push-ups, deadbug) have no kg field', () => {
    assertEq(document.querySelectorAll('input[data-id="push-ups-bars-a"][data-field="kg"]').length, 0);
    assertEq(document.querySelectorAll('input[data-id="deadbug"][data-field="kg"]').length, 0);
    assert(document.querySelectorAll('input[data-id="push-ups-bars-a"][data-field="reps"]').length > 0, 'reps field still present');
  });

  // T18 — log every set of the first exercise, then save.
  const setValue = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
  document.querySelectorAll('input[data-id="kb-swing-2h"]').forEach((el) => {
    const f = el.dataset.field;
    setValue(el, f === 'kg' ? 16 : f === 'reps' ? 12 : 7);
  });

  check('a fully-logged exercise auto-collapses', () => {
    const card = document.querySelector('[data-exercise-card="kb-swing-2h"]');
    assert(card.classList.contains('is-collapsed'), 'card should collapse once every set is complete');
    assert(card.querySelector('.ex-done'), '"Logged" tag should appear');
    assertEq(card.querySelector('[role="button"]').getAttribute('aria-expanded'), 'false');
  });

  check('tapping the header re-expands a collapsed exercise', () => {
    const card = document.querySelector('[data-exercise-card="kb-swing-2h"]');
    card.querySelector('[data-act="toggle-exercise"]').click();
    assert(!card.classList.contains('is-collapsed'), 'should reopen on tap');
    assertEq(card.dataset.userToggled, '1', 'manual toggle recorded, so it will not auto-collapse itself shut again');
  });

  document.querySelector('[data-act="save-workout"]').click();
  await waitFor(() => document.getElementById('sync-badge').dataset.state === 'synced', 'save confirmed');

  const stored = () => JSON.parse([...github.gists.values()][0].files[DATA_FILE_NAME].content);

  check('T6 / T18 — the saved session lands in the gist with the values entered', () => {
    const d = stored();
    assertEq(d.sessions.length, 1, 'one session written');
    const s = d.sessions[0];
    assertEq(s.dayType, 'A', 'day type');
    assertEq(s.weekInCycle, 1, 'week');
    const swing = s.exercises.find((e) => e.exerciseId === 'kb-swing-2h');
    assertEq(swing.sets.length, 4, 'all four sets stored');
    assertEq(swing.sets[0].kg, 16, 'weight');
    assertEq(swing.sets[0].reps, 12, 'reps');
    assertEq(swing.sets[3].rpe, 7, 'RPE stored as entered, 1-10');
  });

  check('the sync badge reads synced and nothing is left queued', () => {
    assertEq(document.getElementById('sync-badge').dataset.state, 'synced', 'badge state');
    assertEq(JSON.parse(localStorage.getItem('kbwt.pending')).length, 0, 'queue drained');
  });

  check('the session sequence advanced to Day B', () => {
    assert(document.querySelector('#view-today h2').textContent.startsWith('Day B'), 'next session is B');
  });

  // T30 — log offline.
  window.__forceOffline = true;
  Object.defineProperty(navigator, 'onLine', { value: false, configurable: true });

  document.querySelectorAll('input[data-id="goblet-squat-rotation"]').forEach((el) => {
    const f = el.dataset.field;
    setValue(el, f === 'kg' ? 12 : f === 'reps' ? 8 : 6);
  });
  document.querySelector('[data-act="save-workout"]').click();
  await waitFor(() => JSON.parse(localStorage.getItem('kbwt.pending')).length > 0, 'queued offline');

  check('T30 — saving offline queues without error and shows "not yet synced"', () => {
    assertEq(JSON.parse(localStorage.getItem('kbwt.pending')).length, 1, 'one op queued');
    assertEq(stored().sessions.length, 1, 'GitHub untouched while offline');
    const badge = document.getElementById('sync-badge');
    assertEq(badge.dataset.state, 'offline', 'badge shows offline');
    assert(/queued/i.test(badge.textContent), `badge should say queued, got "${badge.textContent}"`);
  });

  check('the offline session is still visible locally', () => {
    assertEq(JSON.parse(localStorage.getItem('kbwt.snapshot')).sessions.length, 2, 'held in the local snapshot');
  });

  // T31 — reconnect.
  window.__forceOffline = false;
  Object.defineProperty(navigator, 'onLine', { value: true, configurable: true });
  window.dispatchEvent(new Event('online'));
  await waitFor(() => document.getElementById('sync-badge').dataset.state === 'synced', 'reconnect flush');

  check('T31 — the queued save completes automatically on reconnect', () => {
    assertEq(stored().sessions.length, 2, 'both sessions now in the gist');
    assertEq(JSON.parse(localStorage.getItem('kbwt.pending')).length, 0, 'queue drained');
    const b = stored().sessions.find((s) => s.dayType === 'B');
    assertEq(b.exercises.find((e) => e.exerciseId === 'goblet-squat-rotation').sets[0].kg, 12, 'offline values intact');
  });

  // T11 — delete a past entry.
  document.querySelector('.tab[data-view="history"]').click();
  const del = await waitFor(() => document.querySelector('[data-act="delete-session"]'), 'delete button');
  window.confirm = () => true;
  del.click();
  await waitFor(() => stored().sessions.length === 1, 'delete synced');

  check('T11 — deleting a past entry syncs and leaves a tombstone', () => {
    assertEq(stored().sessions.length, 1, 'one session removed');
    assertEq(stored().deleted.length, 1, 'tombstone written so a stale device cannot resurrect it');
  });

  // Sign out, then reconnect via the read-only banner's path — the other
  // entry point into the same sign-in form (PRD: the badge/banner "Reconnect"
  // affordance, not just the first-run gate).
  document.querySelector('.tab[data-view="progress"]').click();
  const signOutBtn = await waitFor(() => document.querySelector('[data-act="sign-out"]'), 'sign-out button');
  signOutBtn.click();

  check('signing out clears the persisted token and shows read-only data', () => {
    assertEq(localStorage.getItem('kbwt.authToken'), null, 'token forgotten, not just the in-memory session');
    assertEq(document.getElementById('view-signin').hidden, true, 'still browsing read-only, not forced back to the gate');
    assert(document.getElementById('sync-badge').textContent === 'Sign in', 'badge prompts reconnection');
  });

  document.querySelector('.tab[data-view="today"]').click();
  const reconnectBtn = await waitFor(() => document.querySelector('[data-act="show-signin"]'), 'reconnect banner button');
  reconnectBtn.click();

  check('tapping Reconnect on the read-only banner reopens the same sign-in form', () => {
    assertEq(document.getElementById('view-signin').hidden, false);
    assertEq(document.getElementById('btn-signin-cancel').hidden, false, 'cancel is offered since there is data to go back to');
  });

  document.getElementById('signin-token-input').value = FAKE_TOKEN;
  document.getElementById('btn-connect').click();
  await waitFor(() => document.getElementById('view-signin').hidden, 're-signed in');

  check('reconnecting with the same token picks the existing gist back up, not a new one', () => {
    assertEq(github.gists.size, 1, 'no duplicate gist created on reconnect');
  });

} catch (err) {
  results.push({ name: 'run aborted', passed: false, error: `${err.message}\n${err.stack || ''}` });
}

// --- report -----------------------------------------------------------------

const failed = results.filter((r) => !r.passed);
document.getElementById('rows').innerHTML = results.map((r) =>
  `<li class="${r.passed ? 'pass' : 'fail'}">${r.name}</li>` +
  (r.passed ? '' : `<pre class="err">${String(r.error).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}</pre>`)
).join('');
const s = document.getElementById('summary');
s.className = failed.length ? 'bad' : 'ok';
s.textContent = failed.length ? `${failed.length} FAILED of ${results.length}` : `All ${results.length} integration checks passed`;
window.__integrationResults = { total: results.length, failed: failed.length, results };
console.log(`INTEGRATION: ${results.length - failed.length}/${results.length} passed`);
failed.forEach((f) => console.error(`FAIL: ${f.name}\n${f.error}`));
</script>
</body>
</html>
