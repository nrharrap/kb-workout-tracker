<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kb-workout-tracker — test suite</title>
  <style>
    body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 1.5rem; background: #12141a; color: #e6e8ee; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    #summary { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-weight: 600; }
    .ok { background: #16351f; color: #7ee2a0; }
    .bad { background: #3a1a1e; color: #ff9d9d; }
    li { list-style: none; padding: .25rem 0; border-bottom: 1px solid #23262f; }
    .pass::before { content: "PASS  "; color: #7ee2a0; }
    .fail::before { content: "FAIL  "; color: #ff6b6b; }
    pre { color: #ffb4b4; margin: .35rem 0 .5rem 3.5rem; white-space: pre-wrap; }
    ul { padding: 0; margin: 0; }
  </style>
</head>
<body>
  <h1>kb-workout-tracker — test suite</h1>
  <div id="summary">Running…</div>
  <ul id="results"></ul>

  <script type="module">
    import { runAll, testCount } from './harness.js';
    import './programme.test.js';
    import './model.test.js';
    import './merge.test.js';
    import './sync.test.js';
    import './drive.test.js';

    const results = await runAll();
    const failed = results.filter((r) => !r.passed);

    document.getElementById('results').innerHTML = results
      .map((r) => {
        const row = `<li class="${r.passed ? 'pass' : 'fail'}">${escape(r.name)}</li>`;
        return r.passed ? row : row + `<pre>${escape(r.error || '')}</pre>`;
      })
      .join('');

    const summary = document.getElementById('summary');
    summary.className = failed.length ? 'bad' : 'ok';
    summary.textContent = failed.length
      ? `${failed.length} FAILED of ${results.length}`
      : `All ${results.length} tests passed`;

    // Machine-readable handle for the automated run.
    window.__testResults = { total: results.length, failed: failed.length, results };
    console.log(`TEST SUMMARY: ${results.length - failed.length}/${results.length} passed`);
    failed.forEach((f) => console.error(`FAIL: ${f.name}\n${f.error}`));

    function escape(s) {
      return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }
  </script>
</body>
</html>
